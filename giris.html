<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap / Kayıt Ol - Özel Eğitim Akademi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Merkezi Yönetim Scripti -->
    <script src="app-core.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-indigo-500 selection:text-white transition-colors duration-300 relative overflow-x-hidden">

    <!-- Sabit Tema Değiştirme Butonu (Sağ Üst) -->
    <button onclick="toggleTheme()" class="fixed top-5 right-5 bg-slate-900 hover:bg-slate-800 text-slate-300 p-3 rounded-2xl border border-slate-800 transition shadow-xl text-sm z-50 cursor-pointer" title="Temayı Değiştir">
        <i id="themeIcon" class="fa-solid fa-sun"></i>
    </button>

    <!-- Giriş & Kayıt Kartı -->
    <div class="max-w-md w-full bg-slate-900/80 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-xl relative my-8">
        
        <!-- Logo & Başlık -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 p-[2px] shadow-lg shadow-indigo-500/30 mb-3">
                <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                    <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
                    </svg>
                </div>
            </div>
            <h1 class="text-xl font-black text-white tracking-tight">ÖZEL EĞİTİM AKADEMİ</h1>
            <p class="text-xs text-indigo-400 font-semibold mt-0.5">ÖABT & AGS Sınav Hazırlık Platformu</p>
        </div>

        <!-- Sekmeler (Tabs) -->
        <div class="grid grid-cols-2 bg-slate-950 p-1 rounded-2xl border border-slate-800 mb-6 text-xs font-bold">
            <button id="loginTabBtn" onclick="switchTab('login')" class="py-2.5 rounded-xl transition bg-indigo-600 text-white shadow-md cursor-pointer">
                Giriş Yap
            </button>
            <button id="registerTabBtn" onclick="switchTab('register')" class="py-2.5 rounded-xl transition text-slate-400 hover:text-white cursor-pointer">
                Kayıt Ol
            </button>
        </div>

        <!-- Giriş Formu -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">E-posta Adresi</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="email" id="loginEmail" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 text-xs rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-indigo-500 transition" placeholder="ornek@mail.com">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Şifre</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="password" id="loginPassword" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 text-xs rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Giriş Yap & Çalışmaya Başla
            </button>
        </form>

        <!-- Kayıt Formu (Öğrenci Numarası Alanı Kaldırıldı) -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Ad Soyad</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="regName" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 text-xs rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-indigo-500 transition" placeholder="Ahmet Emre Özer">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">E-posta Adresi</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="email" id="regEmail" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 text-xs rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-indigo-500 transition" placeholder="ornek@mail.com">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Şifre</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="password" id="regPassword" required class="w-full bg-slate-950 border border-slate-800 text-slate-100 text-xs rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-xs font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-user-plus"></i> Hesap Oluştur & Başla
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-500">
            &copy; 2026 Özel Eğitim ÖABT & AGS Hazırlık Platformu. Tüm hakları saklıdır.
        </div>
    </div>

    <!-- Scriptler -->
    <script>
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            if(body.classList.contains('bg-slate-950')) {
                body.classList.remove('bg-slate-950', 'text-slate-100');
                body.classList.add('bg-slate-100', 'text-slate-900');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('bg-slate-100', 'text-slate-900');
                body.classList.add('bg-slate-950', 'text-slate-100');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const registerBtn = document.getElementById('registerTabBtn');

            if(tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                
                loginBtn.className = 'py-2.5 rounded-xl transition bg-indigo-600 text-white shadow-md cursor-pointer';
                registerBtn.className = 'py-2.5 rounded-xl transition text-slate-400 hover:text-white cursor-pointer';
            } else {
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                
                registerBtn.className = 'py-2.5 rounded-xl transition bg-indigo-600 text-white shadow-md cursor-pointer';
                loginBtn.className = 'py-2.5 rounded-xl transition text-slate-400 hover:text-white cursor-pointer';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            
            let existingUser = JSON.parse(localStorage.getItem('ozel_egitim_user') || '{}');
            existingUser.email = email;
            if(!existingUser.name) {
                existingUser.name = email.split('@')[0];
            }
            if(existingUser.xp === undefined) existingUser.xp = 150;
            if(existingUser.streak === undefined) existingUser.streak = 1;

            localStorage.setItem('ozel_egitim_user', JSON.stringify(existingUser));
            window.location.href = "index.html";
        }

        function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regName').value.trim();
            const parts = fullName.split(' ');
            const name = parts[0] || 'Aday';
            const surname = parts.slice(1).join(' ') || '';
            const email = document.getElementById('regEmail').value.trim();

            const newUser = {
                name: name,
                surname: surname,
                email: email,
                xp: 150,
                streak: 1
            };

            localStorage.setItem('ozel_egitim_user', JSON.stringify(newUser));
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
